<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>web-model-bridge — Dashboard</title>
  <link rel="stylesheet" href="/dashboard/style.css">
</head>
<body>
  <nav class="topbar">
    <div class="topbar-brand">
      <span class="logo">🌉</span>
      <span class="brand-name">web-model-bridge</span>
    </div>
    <div class="topbar-status" id="server-status">
      <span class="pulse green"></span>
      <span>Running</span>
    </div>
  </nav>

  <main class="container">
    <!-- API Endpoints Card -->
    <section class="card">
      <div class="card-header">
        <h2>API Endpoints</h2>
        <span class="badge">Ready</span>
      </div>
      <div class="card-body">
        <div class="endpoint-group">
          <label>OpenAI Format <span class="hint">(OpenClaw, Cursor, Open WebUI)</span></label>
          <div class="url-box">
            <code id="openai-url"></code>
            <button class="btn-copy" data-target="openai-url">Copy</button>
          </div>
        </div>
        <div class="endpoint-group">
          <label>Anthropic Format <span class="hint">(Claude Code)</span></label>
          <div class="url-box">
            <code id="anthropic-url"></code>
            <button class="btn-copy" data-target="anthropic-url">Copy</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Providers Card -->
    <section class="card">
      <div class="card-header">
        <h2>Providers</h2>
        <span class="count" id="provider-count">0 / 0</span>
      </div>
      <div class="card-body" id="provider-list">
        <div class="loading">Loading providers...</div>
      </div>
    </section>

    <!-- Profiles Card -->
    <section class="card">
      <div class="card-header">
        <h2>Profiles</h2>
        <span class="count" id="profile-count"></span>
      </div>
      <div class="card-body" id="profile-list">
        <div class="loading">Loading profiles...</div>
      </div>
      <div class="profile-create">
        <input id="profile-name" type="text" placeholder="new profile name" autocomplete="off" />
        <select id="profile-engine">
          <option value="chrome">Chrome</option>
          <option value="camoufox">Camoufox</option>
        </select>
        <button class="btn-copy" id="profile-create">Create</button>
      </div>
    </section>

    <!-- System Health Card -->
    <section class="card">
      <div class="card-header">
        <h2>System</h2>
      </div>
      <div class="card-body">
        <div class="stats-grid" id="health-info">
          <div class="loading">Loading...</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <a href="https://github.com/linuxhsj/openclaw-zero-token/issues/176" target="_blank">GitHub Issue #176</a>
    <span class="sep">·</span>
    <span>web-model-bridge v0.1.0</span>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="/dashboard/app.js"></script>
</body>
</html>
